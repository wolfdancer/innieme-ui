services:
  client:
    build:
      context: .
      dockerfile: client/Dockerfile.debug
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - server

  server:
    build:
      context: .
      dockerfile: server/Dockerfile.debug
    restart: always
    ports:
      - "3001:3001"
      - "9229:9229"
    volumes:
      - ./config.yaml:/app/config/config.yaml
      - ./data:/app/config/data
    environment:
      - CONFIG_PATH=/app/config/config.yaml